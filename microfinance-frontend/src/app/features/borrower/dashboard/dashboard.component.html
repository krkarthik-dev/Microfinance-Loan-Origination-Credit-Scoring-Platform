<div class="dashboard-container">
  <!-- Hero Section -->
  <header class="dashboard-header">
    <div class="welcome-text">
      <h1>Welcome back, <span>{{ userName }}</span></h1>
      <p>Here is a summary of your financial footprint.</p>
    </div>
    <div class="cta-actions">
      <!-- AC3: Primary CTA -->
      <button class="btn btn-primary" routerLink="/applicant/apply">Apply for a New Loan</button>
    </div>
  </header>

  <!-- Metrics Section -->
  <main class="dashboard-metrics">
    <!-- AC4: Loading State -->
    <div class="state-container" *ngIf="isLoading">
      <div class="loader"></div>
      <p>Loading your metrics...</p>
    </div>

    <!-- AC4: Error State -->
    <div class="state-container error-state" *ngIf="!isLoading && errorMessage">
      <div class="icon-warning">⚠</div>
      <p>{{ errorMessage }}</p>
      <button class="btn btn-secondary" (click)="fetchMetrics()">Try Again</button>
    </div>

    <!-- AC2: Summary Cards -->
    <div class="cards-grid" *ngIf="!isLoading && !errorMessage && metrics">
      
      <!-- Card 1: Active Loans -->
      <div class="metric-card card-active">
        <div class="card-icon">💼</div>
        <div class="card-content">
          <h3>Active Loans</h3>
          <div class="metric-value">{{ metrics.activeLoans }}</div>
        </div>
      </div>

      <!-- Card 2: Total Outstanding -->
      <div class="metric-card card-outstanding">
        <div class="card-icon">💰</div>
        <div class="card-content">
          <h3>Total Outstanding</h3>
          <!-- Angular currency pipe formats BigDecimal correctly -->
          <div class="metric-value">{{ metrics.totalOutstanding | currency:'USD' }}</div>
        </div>
      </div>

      <!-- Card 3: Pending Applications -->
      <div class="metric-card card-pending">
        <div class="card-icon">⏳</div>
        <div class="card-content">
          <h3>Pending Applications</h3>
          <div class="metric-value">{{ metrics.pendingApplications }}</div>
        </div>
      </div>

    </div>
  </main>
</div>
