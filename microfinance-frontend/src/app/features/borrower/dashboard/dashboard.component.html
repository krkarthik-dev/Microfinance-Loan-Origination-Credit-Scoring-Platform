<div class="dashboard-container">
  <!-- Hero Section -->
  <header class="dashboard-header">
    <div class="welcome-text-group" style="display: flex; align-items: center; gap: 1rem;">
      <button class="profile-icon-btn" routerLink="/applicant/profile" title="Profile & KYC Settings">
        <svg xmlns="http://www.w3.org/2001/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
      <div class="welcome-text">
        <h1>Welcome back, <span>{{ userName }}</span></h1>
        <p>Here is a summary of your financial footprint.</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="cta-actions">
        <!-- AC3: Primary CTA with dynamic lock -->
        <button class="btn btn-primary" 
                [class.locked-btn]="metrics && !metrics.profileComplete"
                (click)="onApplyClick()">
          Apply for a New Loan
        </button>
        
        <!-- Validation Message displayed right below button -->
        <div class="validation-tooltip" *ngIf="validationMessage">
          {{ validationMessage }}
        </div>
      </div>
    </div>
  </header>

  <!-- Metrics Section -->
  <main class="dashboard-metrics">
    <!-- AC4: Loading State -->
    <div class="state-container" *ngIf="isLoading">
      <div class="loader"></div>
      <p>Loading your metrics...</p>
    </div>

    <!-- AC4: Error State -->
    <div class="state-container error-state" *ngIf="!isLoading && errorMessage">
      <div class="icon-warning">⚠</div>
      <p>{{ errorMessage }}</p>
      <button class="btn btn-secondary" (click)="fetchMetrics()">Try Again</button>
    </div>

    <!-- KYC Warning Banner -->
    <div id="kyc-warning" class="warning-banner" *ngIf="!isLoading && !errorMessage && metrics && !metrics.profileComplete">
      <div class="banner-icon">🔒</div>
      <div class="banner-content">
        <h3>Action Required</h3>
        <p>Complete your Profile & KYC (PAN and Aadhaar) to unlock lending features.</p>
      </div>
      <button class="btn btn-secondary banner-btn" routerLink="/applicant/profile">Complete KYC</button>
    </div>

    <!-- AC2: Summary Cards -->
    <div class="cards-grid" *ngIf="!isLoading && !errorMessage && metrics">
      
      <!-- Card 1: Active Loans -->
      <app-metric-card 
        title="Active Loans" 
        [value]="metrics.activeLoans" 
        icon="💼" 
        type="active">
      </app-metric-card>

      <!-- Card 2: Total Outstanding -->
      <app-metric-card 
        title="Total Outstanding" 
        [value]="metrics.totalOutstanding" 
        icon="💰" 
        type="outstanding"
        [isCurrency]="true">
      </app-metric-card>

      <!-- Card 3: Pending Applications -->
      <app-metric-card 
        title="Pending Applications" 
        [value]="metrics.pendingApplications" 
        icon="⏳" 
        type="pending">
      </app-metric-card>

    </div>

    <!-- AC1, AC2, AC3, AC4: Recent Activity Table -->
    <section id="recent-activity" class="recent-activity-section" *ngIf="!isLoading && !errorMessage && metrics">
      <h2>Recent Activity</h2>
      
      <!-- Empty State -->
      <div class="empty-state" *ngIf="!metrics.recentActivity || metrics.recentActivity.length === 0">
        <div class="empty-icon">📁</div>
        <p>You have no recent loan activity.</p>
        <button class="btn btn-secondary" routerLink="/applicant/apply">Start an Application</button>
      </div>

      <!-- Data Grid -->
      <app-data-table
        *ngIf="metrics.recentActivity && metrics.recentActivity.length > 0"
        [columns]="activityColumns"
        [data]="metrics.recentActivity">
      </app-data-table>
    </section>
  </main>
</div>
