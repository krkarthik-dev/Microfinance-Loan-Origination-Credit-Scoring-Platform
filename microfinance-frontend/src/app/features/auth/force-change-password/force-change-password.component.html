<div class="auth-container">
  <div class="auth-card">
    <div class="brand">
      <h2>Change Password Required</h2>
      <p>For your security, you must change your temporary password before accessing the dashboard.</p>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="oldPassword">Current Temporary Password</label>
        <input id="oldPassword" type="password" formControlName="oldPassword" class="form-control" />
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" formControlName="newPassword" class="form-control" />
        <div class="error-msg" *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid">
          Password must be at least 8 characters.
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" class="form-control" />
        <div class="error-msg" *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched">
          Passwords do not match.
        </div>
      </div>

      <div *ngIf="error" class="error-alert">
        {{ error }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="passwordForm.invalid || loading">
        {{ loading ? 'Updating...' : 'Change Password & Login' }}
      </button>
    </form>
  </div>
</div>
