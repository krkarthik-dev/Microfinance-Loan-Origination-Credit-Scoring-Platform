<div class="disbursement-container fade-in">
  <header class="page-header">
    <div class="title-area">
      <h1>Disbursement Queue</h1>
      <p>Manage manual offline payouts for approved applications</p>
    </div>
    <div class="actions-area">
      <button class="btn btn-secondary" (click)="loadQueue()">↻ Refresh</button>
      <button class="btn btn-ghost" routerLink="/admin/dashboard">← Back to Dashboard</button>
    </div>
  </header>

  <div class="page-content">
    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-state card-panel">
      <div class="spinner"></div>
      <p>Loading disbursement queue...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="errorMessage && !isLoading" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <!-- Queue Table -->
    <div *ngIf="!isLoading && !errorMessage">
      <div class="alert alert-warning mb-3" *ngIf="queueItems.length === 0">
        No applications are currently pending disbursement.
      </div>

      <div *ngIf="queueItems.length > 0">
        <app-data-table
          [columns]="columns"
          [data]="queueItems"
          [isRowClickable]="false"
          emptyMessage="No applications pending disbursement."
          (actionClick)="onActionClick($event)">
        </app-data-table>
        <p class="hint-text text-center mt-3">Click "Review" to process disbursement for an application.</p>
      </div>
    </div>
  </div>
</div>
