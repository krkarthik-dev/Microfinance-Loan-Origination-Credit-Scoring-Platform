spring:
  # ==================== H2 IN-MEMORY DATABASE FOR TESTS ====================
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  # Tests use ddl-auto: create-drop so JPA builds schema from entities
  # Flyway is disabled — no SQL migration scripts needed for tests
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # ==================== FLYWAY DISABLED FOR TESTS ====================
  # SQL migrations use PostgreSQL syntax; tests use H2 with entity-generated schema
  flyway:
    enabled: false

  security:
    user:
      name: testuser
      password: testpass

logging:
  level:
    com.microfinance: DEBUG
    org.springframework.security: WARN
    org.hibernate: WARN
    org.flywaydb: WARN

app:
  jwt:
    secret: "M2FjNzhlZjkyZDE0YzRlOWI4YTNjZGFjYzYwNjVhOGYzYmQ5MjU3NzI0OWMwNDRlYzc2NWRjMjQ0ZjJiNzNkNQ=="
    expiration-ms: 86400000
